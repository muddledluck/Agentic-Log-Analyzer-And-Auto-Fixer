<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
</head>
<body>

  <!-- 1. THIS IS REQUIRED: It renders your markdown content -->
  {{ content }}

  <!-- 2. MERMAID LOADER -->
  {% if site.mermaid %}
    <script type="module">
      // Step A: Find all Jekyll-generated mermaid blocks
      // Jekyll outputs <pre><code class="language-mermaid">...</code></pre>
      const codeBlocks = document.querySelectorAll('code.language-mermaid');
      
      codeBlocks.forEach((block) => {
        // Step B: Create a new <pre class="mermaid"> element
        const pre = document.createElement('pre');
        pre.className = 'mermaid';
        pre.textContent = block.textContent;
        
        // Step C: Replace the Jekyll block with the Mermaid-ready block
        block.parentElement.replaceWith(pre);
      });

      // Step D: Initialize and render
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: true });
    </script>
  {% endif %}

</body>
</html>
