services:
  redis:
    image: redis:7-alpine
    container_name: alaa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: alaa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: alaa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  alaa-ai-service:
    build:
      context: ./alaa-ai-service
      dockerfile: Dockerfile
    container_name: alaa-ai-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./alaa-ai-service:/app
    environment:
      - HOST=0.0.0.0

volumes:
  redis_data:
  postgres_data:
